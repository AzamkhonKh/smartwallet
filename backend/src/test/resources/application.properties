# Test Database Configuration (using H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# OAuth2 Resource Server JWT Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

# Dummy API Keys to prevent placeholder resolution errors
mistral.api-key=dummy-key
openrouter.api-key=dummy-key
recipewallet.ocr.provider=mock
recipewallet.llm.provider=mock
recipewallet.llm.model=google/gemma-3-27b-it
recipewallet.storage.provider=mock
recipewallet.firebase.storage-bucket=mock-bucket
recipewallet.firebase.credentials=mock-credentials

# Application Configuration
recipewallet.app.mode=dev
recipewallet.app.public-domain=http://localhost:8080

# Local Disk Storage Configuration
recipewallet.storage.disk.upload-dir=uploads
recipewallet.storage.disk.base-url=${recipewallet.app.public-domain}/uploads/

LANGFUSE_SECRET_KEY=dummy-key
LANGFUSE_PUBLIC_KEY=dummy-key
LANGFUSE_BASE_URL=http://localhost:3000
exchagerate.api-key=dummy-key
